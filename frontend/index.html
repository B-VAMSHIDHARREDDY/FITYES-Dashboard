<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FITYES — real-estate market intelligence and deal pipeline" />
    <title>FITYES · Real Estate Desk</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("fityes-theme");
          var dark = t ? t === "dark" : true; // dark (ink + lime) is the default theme
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
